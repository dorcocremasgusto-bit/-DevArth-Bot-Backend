<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLAUS SMS BOOMER</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="crt-overlay"></div>
    
    <div class="container">
        <header>
            <h1 class="glitch" data-text="KLAUS SMS BOOMER">KLAUS SMS BOOMER</h1>
            <p class="subtitle">REAL SMS FLOOD BANNING SYSTEM</p>
        </header>

        <div class="terminal-window">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span>root@sms-boomer:~</span>
            </div>
            
            <div class="input-group">
                <label for="phoneNumber">TARGET NUMBER (INTERNATIONAL FORMAT)</label>
                <!-- Exemple: 15551234567 ou 33612345678 -->
                <input type="text" id="phoneNumber" placeholder="+1 555 000 0000" autocomplete="off">
                <small style="color: #ff003c; font-size: 0.7rem;">*Doit inclure le code pays (ex: +33...)</small>
            </div>

            <button id="startBtn" onclick="startSmsBoomer()">ACTIVATE SMS BOOMER</button>

            <div class="status-panel">
                <div class="stat-box">
                    <span>STATUS:</span>
                    <span id="statusText">IDLE</span>
                </div>
                <div class="stat-box">
                    <span>SENT SMS:</span>
                    <span id="countDisplay">0 / 300</span>
                </div>
                <div class="stat-box">
                    <span>TIME REMAINING:</span>
                    <span id="timeDisplay">03:00</span>
                </div>
            </div>

            <div class="log-console" id="logConsole">
                <div>> System ready.</div>
                <div>> Waiting for target...</div>
            </div>
        </div>

        <footer>
            Create By Klaus Dev
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
